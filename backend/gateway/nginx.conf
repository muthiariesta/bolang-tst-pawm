# Semua trafik datang lewat cloudflared, jadi IP asli diambil dari CF-Connecting-IP
# SEBELUM rate limit, supaya limit dihitung per pengunjung, bukan per container tunnel.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;
limit_req_zone $binary_remote_addr zone=api:1m rate=60r/m;

server {
  listen 80;
  server_tokens off;
  client_max_body_size 64k;

  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
  add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;

  location / {
    if ($request_method = OPTIONS) { return 204; }
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://core-service:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
  error_page 429 = @ratelimited;
  location @ratelimited {
    default_type application/json;
    return 429 '{"error":"RATE_LIMITED","message":"Terlalu banyak permintaan. Maksimal 60 per menit."}';
  }
}

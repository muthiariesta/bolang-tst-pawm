x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  core-service:
    build: .
    image: bolang-core:1.1
    env_file: .env            # rahasia, jangan di-commit
    volumes: ["jr-data:/data"]
    mem_limit: 256m           # jaga STB tidak hang
    cpus: 0.5
    restart: unless-stopped
    logging: *logging

  gateway:
    image: nginx:1.28-alpine
    ports: ["8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [core-service]
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    logging: *logging

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on: [gateway]
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    logging: *logging
    profiles: ["tunnel"]      # nyalakan: docker compose --profile tunnel up -d

volumes:
  jr-data:
